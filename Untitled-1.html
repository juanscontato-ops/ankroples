<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ankropoles</title>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        
        /* --- NOVAS PROPRIEDADES DE FUNDO --- */
        /* Coloque o link ou o caminho local da sua imagem dentro do url() */
        background-image: url("C:\\Users\\LBR EQUIPAMENTOS\\Downloads\\bg2.jpg"); 
        background-size: cover; /* Faz a imagem cobrir a tela inteira sem distorcer */
        background-position: center; /* Mantém a imagem centralizada */
        background-repeat: no-repeat; /* Evita que a imagem fique se repetindo como um mosaico */
        /* ----------------------------------- */
        
        color: #f3f3f3;
        font-family: Arial, sans-serif;
    }

    canvas {
        border: 8px solid #333;
        border-radius: 12px;
        background: linear-gradient(to top, #79b855 0%, #a5dc88 40%, #87c1f2 100%);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    .hint {
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px;
        text-align: center;
        pointer-events: none;
        font-size: 14px;
        letter-spacing: 0.05em;
    }
</style>
</head>
<body>
    <div class="hint">Use ← → / A D para mover | Espaço / ↑ para pular | Colete todas as moedas e alcance a bandeira</div>
    <canvas id="telaDoJogo" width="800" height="450"></canvas>

    <script>
        const canvas = document.getElementById('telaDoJogo');
        const ctx = canvas.getContext('2d');

        const player = {
            x: 40,
            y: 360,
            width: 34,
            height: 42,
            vx: 0,
            vy: 0,
            speed: 4.5,
            jumpStrength: -14,
            grounded: false,
            color: '#e63946',
            alive: true,
            score: 0,
        };

        const keys = {};
        const gravity = 0.75;
        const friction = 0.85;

        const platforms = [
            { x: 0, y: 410, width: 800, height: 40 },
            { x: 120, y: 330, width: 180, height: 22 },
            { x: 360, y: 280, width: 140, height: 22 },
            { x: 560, y: 230, width: 180, height: 22 },
            { x: 680, y: 160, width: 100, height: 22 },
            { x: 260, y: 200, width: 120, height: 22 },
        ];

        const coins = [
            { x: 150, y: 290, collected: false },
            { x: 390, y: 250, collected: false },
            { x: 590, y: 200, collected: false },
            { x: 710, y: 130, collected: false },
            { x: 310, y: 160, collected: false },
        ];

        const enemies = [
            { x: 450, y: 372, width: 36, height: 36, dir: 1, minX: 450, maxX: 620, speed: 2.2, color: '#264653' },
            { x: 220, y: 292, width: 32, height: 32, dir: 1, minX: 220, maxX: 280, speed: 1.4, color: '#264653' },
        ];

        const goal = { x: 760, y: 120, width: 24, height: 90 };
        let finished = false;

        window.addEventListener('keydown', (event) => {
            keys[event.key] = true;
            if (event.key === 'r' && !player.alive) {
                resetGame();
            }
        });

        window.addEventListener('keyup', (event) => {
            keys[event.key] = false;
        });

        function rectsOverlap(a, b) {
            return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y;
        }

        function resolvePlatformCollision(player, platform) {
            const previousY = player.y - player.vy;
            const previousX = player.x - player.vx;

            if (previousY + player.height <= platform.y && player.y + player.height >= platform.y) {
                player.y = platform.y - player.height;
                player.vy = 0;
                player.grounded = true;
            } else if (previousY >= platform.y + platform.height && player.y <= platform.y + platform.height) {
                player.y = platform.y + platform.height;
                player.vy = 0;
            } else if (previousX + player.width <= platform.x && player.x + player.width >= platform.x) {
                player.x = platform.x - player.width;
                player.vx = 0;
            } else if (previousX >= platform.x + platform.width && player.x <= platform.x + platform.width) {
                player.x = platform.x + platform.width;
                player.vx = 0;
            }
        }

        function updatePlayer() {
            if (!player.alive || finished) return;

            if (keys.ArrowLeft || keys.a || keys.A) {
                player.vx = -player.speed;
            } else if (keys.ArrowRight || keys.d || keys.D) {
                player.vx = player.speed;
            } else {
                player.vx *= friction;
                if (Math.abs(player.vx) < 0.3) player.vx = 0;
            }

            if ((keys.ArrowUp || keys.w || keys.W || keys.Space) && player.grounded) {
                player.vy = player.jumpStrength;
                player.grounded = false;
            }

            player.vy += gravity;
            player.x += player.vx;
            player.y += player.vy;

            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            player.grounded = false;
            platforms.forEach(platform => {
                if (rectsOverlap(player, platform)) {
                    resolvePlatformCollision(player, platform);
                }
            });

            if (player.y + player.height > canvas.height) {
                player.y = canvas.height - player.height;
                player.vy = 0;
                player.grounded = true;
            }

            coins.forEach(coin => {
                if (!coin.collected && rectsOverlap(player, { x: coin.x - 10, y: coin.y - 10, width: 20, height: 20 })) {
                    coin.collected = true;
                    player.score += 1;
                }
            });

            enemies.forEach(enemy => {
                if (rectsOverlap(player, enemy)) {
                    if (player.vy > 2 && player.y + player.height - enemy.y < 20) {
                        enemy.x = enemy.minX;
                        enemy.dir = 1;
                        player.vy = player.jumpStrength * 0.6;
                    } else {
                        player.alive = false;
                    }
                }
            });

            if (rectsOverlap(player, goal) && player.score === coins.length) {
                finished = true;
            }
        }

        function updateEnemies() {
            enemies.forEach(enemy => {
                enemy.x += enemy.speed * enemy.dir;
                if (enemy.x < enemy.minX || enemy.x + enemy.width > enemy.maxX) {
                    enemy.dir *= -1;
                }
            });
        }

        function drawBackground() {
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#90d7ff');
            gradient.addColorStop(0.6, '#71b7e8');
            gradient.addColorStop(1, '#4f8cc8');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#f7f7f7';
            for (let i = 0; i < 12; i++) {
                const cloudX = (i * 130 + performance.now() * 0.01) % 900 - 120;
                const cloudY = 60 + (i % 3) * 20;
                ctx.beginPath();
                ctx.arc(cloudX, cloudY, 22, 0, Math.PI * 2);
                ctx.arc(cloudX + 28, cloudY, 28, 0, Math.PI * 2);
                ctx.arc(cloudX + 56, cloudY, 22, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawPlatform(platform) {
            ctx.fillStyle = '#6b4f2d';
            ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
            ctx.strokeStyle = '#3f2b18';
            ctx.lineWidth = 3;
            ctx.strokeRect(platform.x, platform.y, platform.width, platform.height);
        }

        function drawCoin(coin) {
            if (coin.collected) return;
            ctx.fillStyle = '#ffdc3d';
            ctx.beginPath();
            ctx.arc(coin.x, coin.y, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#b38c00';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function drawEnemy(enemy) {
            ctx.fillStyle = enemy.color;
            ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
            ctx.fillStyle = '#fff';
            ctx.fillRect(enemy.x + 6, enemy.y + 8, 8, 8);
            ctx.fillRect(enemy.x + 22, enemy.y + 8, 8, 8);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(enemy.x + 10, enemy.y + 28);
            ctx.lineTo(enemy.x + 26, enemy.y + 28);
            ctx.stroke();
        }

        function drawPlayer() {
            ctx.fillStyle = player.alive ? player.color : '#9b1313';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = '#000';
            ctx.fillRect(player.x + 8, player.y + 10, 6, 6);
            ctx.fillRect(player.x + 20, player.y + 10, 6, 6);
        }

        function drawGoal() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(goal.x, goal.y, 8, goal.height);
            ctx.fillStyle = '#d62828';
            ctx.fillRect(goal.x + 8, goal.y + 10, 24, 18);
        }

        function drawHUD() {
            ctx.fillStyle = '#ffffff';
            ctx.font = '18px Arial';
            ctx.fillText(`Moedas: ${player.score} / ${coins.length}`, 18, 28);

            if (!player.alive) {
                ctx.fillStyle = 'rgba(0,0,0,0.75)';
                ctx.fillRect(140, 160, 520, 120);
                ctx.fillStyle = '#ffcc00';
                ctx.font = '28px Arial';
                ctx.fillText('Você foi derrotado! Pressione R para reiniciar', 160, 220);
            }

            if (finished) {
                ctx.fillStyle = 'rgba(0,0,0,0.75)';
                ctx.fillRect(140, 160, 520, 120);
                ctx.fillStyle = '#00ff99';
                ctx.font = '28px Arial';
                ctx.fillText('Fase completa! Parabéns!', 240, 220);
                ctx.fillStyle = '#ffffff';
                ctx.font = '20px Arial';
                ctx.fillText('Recarregue a página para jogar outra vez.', 210, 260);
            }
        }

        function resetGame() {
            player.x = 40;
            player.y = 360;
            player.vx = 0;
            player.vy = 0;
            player.grounded = false;
            player.alive = true;
            player.score = 0;
            coins.forEach(coin => coin.collected = false);
            finished = false;
        }

        function loop() {
            updatePlayer();
            updateEnemies();
            drawBackground();
            platforms.forEach(drawPlatform);
            coins.forEach(drawCoin);
            drawGoal();
            enemies.forEach(drawEnemy);
            drawPlayer();
            drawHUD();
            requestAnimationFrame(loop);
        }

        resetGame();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
